<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Recuperar senha — Soundtrackr</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" type="image/png" href="/static/img/logo.png">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js"></script>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-wrap { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; }
    .auth-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .auth-logo img { width: 32px; height: 32px; border-radius: 7px; }
    .auth-logo-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.5px; color: var(--chrome-lt); }
    .auth-sub { font-size: 13px; color: var(--text-3); margin-bottom: 4px; }
    .auth-divider { height: 1px; background: var(--border); margin: 4px 0; }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap i { position: absolute; left: 12px; color: var(--text-3); font-size: 16px; pointer-events: none; }
    .input-wrap .input { width: 100%; padding-left: 36px; }
    .full-btn { width: 100%; justify-content: center; padding: 10px; font-size: 14px; }
    .auth-footer { font-size: 13px; color: var(--text-3); text-align: center; }
    .auth-footer a { color: var(--chrome-lt); font-weight: 500; }
    .success-box {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 14px; background: rgba(80,200,140,0.08);
      border: 1px solid rgba(80,200,140,0.25); border-radius: var(--radius-sm);
      font-size: 13px; color: var(--text-2); line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-logo">
      <img src="/static/img/logo.png" alt="Logo">
      <span class="auth-logo-name">Soundtrackr</span>
    </div>

    <div class="glass" style="padding: 28px; display: flex; flex-direction: column; gap: 14px;">
      <div>
        <h1 style="font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; color:var(--text-1); margin-bottom:4px">
          Recuperar senha
        </h1>
        <p class="auth-sub">Enviaremos um link de redefinição para seu e-mail</p>
      </div>

      <div class="auth-divider"></div>

      {% if success %}
        <div class="success-box">
          <i class="ph ph-check-circle" style="font-size:18px;color:#50c88c;flex-shrink:0"></i>
          <div>
            Se esse e-mail estiver cadastrado, você receberá um link de recuperação em instantes.
          </div>
        </div>
      {% else %}
        <form method="POST" style="display:flex; flex-direction:column; gap:10px;">
          <div class="input-wrap">
            <i class="ph ph-envelope"></i>
            <input type="email" name="email" class="input" placeholder="Seu e-mail cadastrado" required autocomplete="email">
          </div>
          <button type="submit" class="btn-primary full-btn" style="margin-top:4px">
            <i class="ph ph-paper-plane-tilt" style="font-size:15px"></i>
            Enviar link
          </button>
        </form>
      {% endif %}
    </div>

    <div class="auth-footer">
      <a href="/login">← Voltar para o login</a>
    </div>
  </div>

</body>
</html>
