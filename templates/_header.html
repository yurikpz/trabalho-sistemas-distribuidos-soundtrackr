<script>
// ── Tema ──────────────────────────────────────────────────────────────────────
function toggleTheme() {
  const html  = document.documentElement;
  const isDark = html.getAttribute('data-theme') !== 'light';
  const next  = isDark ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  const icon = document.getElementById('theme-icon');
  if (icon) icon.className = next === 'light' ? 'ph ph-sun' : 'ph ph-moon';
  localStorage.setItem('theme', next);
}

(function () {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  const icon = document.getElementById('theme-icon');
  if (icon) icon.className = saved === 'light' ? 'ph ph-sun' : 'ph ph-moon';
})();


// ── Busca de usuários ─────────────────────────────────────────────────────────
(function () {
  let _timer = null;
  const inp = document.getElementById('userSearchInput');
  const res = document.getElementById('userSearchResults');
  if (!inp) return;

  inp.addEventListener('input', () => {
    clearTimeout(_timer);
    const q = inp.value.trim();
    if (q.length < 2) { res.classList.remove('open'); return; }
    _timer = setTimeout(() => _fetchUsers(q), 300);
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.user-search-wrap')) res.classList.remove('open');
  });

  async function _fetchUsers(q) {
    try {
      const data = await fetch(`/users/search?q=${encodeURIComponent(q)}`).then(r => r.json());
      if (!data.length) {
        res.innerHTML = '<div class="user-search-empty">Nenhum usuário encontrado</div>';
      } else {
        res.innerHTML = data.map(u => `
          <a class="user-result-item" href="/u/${u.id}">
            <img
              class="user-result-avatar"
              src="/static/${u.avatar}"
              onerror="this.src='/static/img/default.png'"
            >
            <div>
              <div class="user-result-name">${u.username}</div>
              ${u.fandom ? `<div class="user-result-fandom">${u.fandom}</div>` : ''}
            </div>
          </a>
        `).join('');
      }
      res.classList.add('open');
    } catch (e) {
      console.error(e);
    }
  }
})();


// ── Notificações ──────────────────────────────────────────────────────────────
const notifDropdown = document.getElementById('notifDropdown');
const notifList     = document.getElementById('notifList');
const notifBadge    = document.getElementById('notifBadge');

async function refreshNotifBadge() {
  try {
    const data = await fetch('/notifications/unread_count').then(r => r.json());
    if (data.count > 0) {
      notifBadge.textContent = data.count > 9 ? '9+' : data.count;
      notifBadge.style.display = 'flex';
    } else {
      notifBadge.style.display = 'none';
    }
  } catch (e) { console.error(e); }
}

function notifText(n) {
  const name = `<strong>${n.actor_username}</strong>`;
  switch (n.type) {
    case 'follow':      return `${name} começou a seguir você`;
    case 'review_like': return `${name} curtiu sua review`;
    case 'list_like':   return `${name} curtiu sua lista`;
    default:             return `${name} interagiu com você`;
  }
}

function notifIcon(type) {
  switch (type) {
    case 'follow':      return { cls: 'follow',      icon: 'ph-user-plus' };
    case 'review_like': return { cls: 'review_like', icon: 'ph-heart' };
    case 'list_like':   return { cls: 'list_like',   icon: 'ph-heart' };
    default:             return { cls: 'follow',      icon: 'ph-bell' };
  }
}

function timeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
  if (diff < 60) return 'agora';
  if (diff < 3600) return `${Math.floor(diff/60)}min`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h`;
  return `${Math.floor(diff/86400)}d`;
}

async function loadNotifications() {
  try {
    const data = await fetch('/notifications').then(r => r.json());
    if (!data.length) {
      notifList.innerHTML = '<div class="notif-empty">Nenhuma notificação ainda</div>';
      return;
    }

    notifList.innerHTML = data.map(n => {
      const { cls, icon } = notifIcon(n.type);
      const href = n.type === 'follow' ? `/u/${n.actor_id}` : '#';
      return `
        <a class="notif-item ${n.is_read ? '' : 'unread'}" href="${href}">
          <div class="notif-avatar-wrap">
            <img class="notif-avatar" src="/static/${n.actor_avatar}" onerror="this.src='/static/img/default.png'">
            <div class="notif-icon-badge ${cls}"><i class="ph-bold ${icon}"></i></div>
          </div>
          <div>
            <div class="notif-text">${notifText(n)}</div>
            <div class="notif-time">${timeAgo(n.createdAt)}</div>
          </div>
        </a>`;
    }).join('');
  } catch (e) {
    console.error(e);
    notifList.innerHTML = '<div class="notif-empty">Erro ao carregar</div>';
  }
}

async function toggleNotifications() {
  const isOpen = notifDropdown.classList.contains('open');
  notifDropdown.classList.toggle('open', !isOpen);

  if (!isOpen) {
    loadNotifications();
    await fetch('/notifications/mark_read', { method: 'POST' });
    notifBadge.style.display = 'none';
  }
}

document.addEventListener('click', e => {
  if (!e.target.closest('.notif-wrap')) notifDropdown.classList.remove('open');
});

refreshNotifBadge();
setInterval(refreshNotifBadge, 30000); // atualiza a cada 30s


// ── Mini player de preview ──────────────────────────────────────────────────
let currentPreviewTrackId = null;
const previewAudio = new Audio();

previewAudio.addEventListener('ended', () => {
  updatePlayButtons(currentPreviewTrackId, false);
});

async function playPreview(trackId, title, artist, cover, btnEl) {
  if (currentPreviewTrackId === trackId && previewAudio.src) {
    if (previewAudio.paused) {
      previewAudio.play();
      updatePlayButtons(trackId, true);
    } else {
      previewAudio.pause();
      updatePlayButtons(trackId, false);
    }
    return;
  }

  showMiniPlayer(title, artist, cover);
  if (btnEl) btnEl.classList.add('loading');

  try {
    const res  = await fetch(`/preview/${trackId}`);
    const data = await res.json();

    if (!data.previewUrl) {
      showToastGlobal('Prévia não disponível para essa faixa.');
      closeMiniPlayer();
      return;
    }

    previewAudio.src = data.previewUrl;
    currentPreviewTrackId = trackId;
    previewAudio.play();
    updatePlayButtons(trackId, true);
  } catch (e) {
    console.error(e);
  } finally {
    if (btnEl) btnEl.classList.remove('loading');
  }
}

function updatePlayButtons(trackId, isPlaying) {
  document.querySelectorAll('.preview-play-btn').forEach(btn => {
    const match = btn.dataset.trackid === String(trackId);
    const icon  = btn.querySelector('i');
    if (icon) icon.className = (match && isPlaying) ? 'ph-fill ph-pause' : 'ph-fill ph-play';
  });
  const miniIcon = document.getElementById('miniPlayerIcon');
  if (miniIcon) miniIcon.className = isPlaying ? 'ph-fill ph-pause' : 'ph-fill ph-play';
}

function showMiniPlayer(title, artist, cover) {
  document.getElementById('miniPlayerTitle').textContent  = title || '—';
  document.getElementById('miniPlayerArtist').textContent = artist || '—';
  document.getElementById('miniPlayerCover').src = cover || '/static/img/default.png';
  document.getElementById('miniPlayer').classList.add('open');
}

function toggleMiniPlayerPlayPause() {
  if (previewAudio.paused) {
    previewAudio.play();
    updatePlayButtons(currentPreviewTrackId, true);
  } else {
    previewAudio.pause();
    updatePlayButtons(currentPreviewTrackId, false);
  }
}

function closeMiniPlayer() {
  previewAudio.pause();
  previewAudio.removeAttribute('src');
  updatePlayButtons(currentPreviewTrackId, false);
  currentPreviewTrackId = null;
  document.getElementById('miniPlayer').classList.remove('open');
}


// ── Compartilhar (link simples) ────────────────────────────────────────────────
async function shareLink(url, title) {
  const fullUrl = url.startsWith('http') ? url : window.location.origin + url;

  if (navigator.share) {
    try {
      await navigator.share({ title: title || 'Soundtrackr', url: fullUrl });
    } catch (e) {}
    return;
  }

  try {
    await navigator.clipboard.writeText(fullUrl);
    showToastGlobal('Link copiado!');
  } catch (e) {
    console.error(e);
  }
}

function showToastGlobal(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<i class="ph ph-check-circle" style="font-size:15px;color:var(--accent-lt)"></i> ${msg}`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}


// ── Card de compartilhamento (imagem) ─────────────────────────────────────────

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function loadImageSafe(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function wrapCenteredText(ctx, text, cx, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  const lines = [];
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);

  const startY = y - ((lines.length - 1) * lineHeight) / 2;
  lines.forEach((l, i) => ctx.fillText(l, cx, startY + i * lineHeight));
}

function drawRelistenIcon(ctx, x, y, size) {
  const cx = x + size / 2;
  const cy = y + size / 2;
  const r  = size / 2 - 3;

  ctx.save();
  ctx.strokeStyle = '#8ab0d0';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.arc(cx, cy, r, -Math.PI * 0.15, Math.PI * 1.55);
  ctx.stroke();

  const angle = Math.PI * 1.55;
  const ax = cx + r * Math.cos(angle);
  const ay = cy + r * Math.sin(angle);
  const arrowSize = 7;

  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(ax - arrowSize, ay - arrowSize * 0.4);
  ctx.moveTo(ax, ay);
  ctx.lineTo(ax - arrowSize * 0.4, ay - arrowSize);
  ctx.stroke();

  ctx.restore();
}

// ── Card de perfil ────────────────────────────────────────────────────────────

async function generateProfileShareCard(username, avatarUrl, fandom) {
  const W = 720, H = 900;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#12141e');
  bgGrad.addColorStop(1, '#0a0c12');
  ctx.fillStyle = bgGrad;
  roundRect(ctx, 0, 0, W, H, 28);
  ctx.fill();

  ctx.strokeStyle = 'rgba(140,170,200,0.18)';
  ctx.lineWidth = 2;
  roundRect(ctx, 1, 1, W - 2, H - 2, 28);
  ctx.stroke();

  const lineGrad = ctx.createLinearGradient(0, 0, W, 0);
  lineGrad.addColorStop(0, 'rgba(160,190,220,0)');
  lineGrad.addColorStop(0.5, 'rgba(160,190,220,0.5)');
  lineGrad.addColorStop(1, 'rgba(160,190,220,0)');
  ctx.fillStyle = lineGrad;
  ctx.fillRect(28, 0, W - 56, 2);

  try {
    await document.fonts.load('700 24px "Space Grotesk"');
    await document.fonts.load('700 44px "Space Grotesk"');
    await document.fonts.load('600 20px "DM Sans"');
    await document.fonts.load('500 18px "DM Sans"');
  } catch (e) {}

  ctx.fillStyle = '#a0bcd0';
  ctx.font = '700 24px "Space Grotesk", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('◈ SOUNDTRACKR', W / 2, 90);

  const avatarSize = 220;
  const avatarY = 160;
  const img = await loadImageSafe(avatarUrl);
  if (img) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(W / 2, avatarY + avatarSize / 2, avatarSize / 2, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(img, W / 2 - avatarSize / 2, avatarY, avatarSize, avatarSize);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(W / 2, avatarY + avatarSize / 2, avatarSize / 2 + 4, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(140,170,200,0.4)';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = '#e0e8f0';
  ctx.font = '700 44px "Space Grotesk", sans-serif';
  ctx.fillText(username, W / 2, avatarY + avatarSize + 80);

  if (fandom) {
    ctx.font = '600 20px "DM Sans", sans-serif';
    const text = fandom.toUpperCase();
    const metrics = ctx.measureText(text);
    const padX = 24, badgeH = 44;
    const badgeW = metrics.width + padX * 2;
    const badgeY = avatarY + avatarSize + 110;

    ctx.fillStyle = 'rgba(140,170,200,0.12)';
    roundRect(ctx, W / 2 - badgeW / 2, badgeY, badgeW, badgeH, badgeH / 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(140,170,200,0.3)';
    ctx.lineWidth = 1.5;
    roundRect(ctx, W / 2 - badgeW / 2, badgeY, badgeW, badgeH, badgeH / 2);
    ctx.stroke();

    ctx.fillStyle = '#a0bcd0';
    ctx.fillText(text, W / 2, badgeY + badgeH / 2 + 7);
  }

  ctx.font = '500 18px "DM Sans", sans-serif';
  ctx.fillStyle = 'rgba(140,175,205,0.55)';
  ctx.fillText('Descubra, avalie e catalogue música', W / 2, H - 60);

  return canvas;
}

async function shareProfileCard(username, avatarUrl, fandom) {
  showToastGlobal('Gerando cartão...');
  const canvas = await generateProfileShareCard(username, avatarUrl, fandom || '');
  openShareCardPreview(canvas, `${username}-soundtrackr.png`);
}

// ── Card de álbum/nota (diário) ────────────────────────────────────────────────

async function generateAlbumShareCard(trackName, artistName, coverUrl, rating, isRelisten) {
  const W = 720, H = 1040;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#12141e');
  bgGrad.addColorStop(1, '#0a0c12');
  ctx.fillStyle = bgGrad;
  roundRect(ctx, 0, 0, W, H, 28);
  ctx.fill();

  ctx.strokeStyle = 'rgba(140,170,200,0.18)';
  ctx.lineWidth = 2;
  roundRect(ctx, 1, 1, W - 2, H - 2, 28);
  ctx.stroke();

  const lineGrad = ctx.createLinearGradient(0, 0, W, 0);
  lineGrad.addColorStop(0, 'rgba(160,190,220,0)');
  lineGrad.addColorStop(0.5, 'rgba(160,190,220,0.5)');
  lineGrad.addColorStop(1, 'rgba(160,190,220,0)');
  ctx.fillStyle = lineGrad;
  ctx.fillRect(28, 0, W - 56, 2);

  try {
    await document.fonts.load('700 24px "Space Grotesk"');
    await document.fonts.load('700 36px "Space Grotesk"');
    await document.fonts.load('500 22px "DM Sans"');
    await document.fonts.load('500 18px "DM Sans"');
  } catch (e) {}

  const coverSize = 560;
  const coverX = (W - coverSize) / 2;
  const coverY = 56;

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = 20;
  roundRect(ctx, coverX, coverY, coverSize, coverSize, 16);
  ctx.fillStyle = '#1a1f2b';
  ctx.fill();
  ctx.restore();

  const img = await loadImageSafe((coverUrl || '').replace('100x100', '600x600'));
  if (img) {
    ctx.save();
    roundRect(ctx, coverX, coverY, coverSize, coverSize, 16);
    ctx.clip();
    ctx.drawImage(img, coverX, coverY, coverSize, coverSize);
    ctx.restore();
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  roundRect(ctx, coverX, coverY, coverSize, coverSize, 16);
  ctx.stroke();

  ctx.fillStyle = '#e8eef4';
  ctx.font = '700 36px "Space Grotesk", sans-serif';
  ctx.textAlign = 'center';
  const titleY = coverY + coverSize + 70;
  wrapCenteredText(ctx, trackName || '', W / 2, titleY, W - 100, 42);

  ctx.fillStyle = 'rgba(160,190,220,0.65)';
  ctx.font = '500 22px "DM Sans", sans-serif';
  ctx.fillText(artistName || '', W / 2, titleY + 46);

  // Estrelas + ícone de re-ouvida na mesma linha
  const starsY = titleY + 96;
  const starChar = '★';
  const starSize = 34;
  ctx.font = `${starSize}px sans-serif`;

  const starsWidth = starSize * 0.9 * 5;
  const relistenIconSize = 30;
  const gapBetween = isRelisten ? 20 : 0;
  const totalWidth = starsWidth + (isRelisten ? relistenIconSize + gapBetween : 0);

  let sx = W / 2 - totalWidth / 2;
  ctx.textAlign = 'left';
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = i < rating ? '#e8c547' : 'rgba(255,255,255,0.12)';
    ctx.fillText(starChar, sx, starsY);
    sx += starSize * 0.9;
  }

  if (isRelisten) {
    sx += gapBetween - 6;
    drawRelistenIcon(ctx, sx, starsY - 22, relistenIconSize);
  }

  ctx.textAlign = 'center';

  let afterStarsY = starsY + 34;
  if (isRelisten) {
    ctx.font = '600 15px "DM Sans", sans-serif';
    ctx.fillStyle = '#8ab0d0';
    ctx.fillText('RE-OUVIDA', W / 2, afterStarsY);
    afterStarsY += 26;
  }

  ctx.strokeStyle = 'rgba(140,170,200,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 60, afterStarsY + 16);
  ctx.lineTo(W / 2 + 60, afterStarsY + 16);
  ctx.stroke();

  ctx.fillStyle = '#a0bcd0';
  ctx.font = '700 24px "Space Grotesk", sans-serif';
  ctx.fillText('◈ SOUNDTRACKR', W / 2, afterStarsY + 60);

  return canvas;
}

async function shareAlbumCard(trackName, artistName, coverUrl, rating, isRelisten) {
  showToastGlobal('Gerando cartão...');
  const canvas = await generateAlbumShareCard(trackName, artistName, coverUrl, rating, isRelisten);
  openShareCardPreview(canvas, `${(trackName || 'musica').replace(/[^a-z0-9]/gi, '-')}-soundtrackr.png`, trackName, artistName, rating);
}

// ── Modal de preview do card (com botão do X) ─────────────────────────────────

function openShareCardPreview(canvas, filename, trackName, artistName, rating) {
  const dataUrl = canvas.toDataURL('image/png');

  let modal = document.getElementById('shareCardModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'shareCardModal';
    modal.className = 'modal';
    modal.innerHTML = `
      <div class="modal-card" style="align-items:center; text-align:center">
        <img id="shareCardImg" style="width:100%; border-radius:16px; margin-bottom:14px">
        <div style="display:flex; gap:8px; width:100%">
          <button class="btn-primary" style="flex:1;justify-content:center" id="shareCardShareBtn">
            <i class="ph ph-share-network"></i> Compartilhar
          </button>
          <button class="btn-ghost" style="flex:1;justify-content:center" id="shareCardDownloadBtn">
            <i class="ph ph-download-simple"></i> Baixar
          </button>
        </div>
        <button class="btn-ghost" style="width:100%;justify-content:center;margin-top:8px" id="shareCardTwitterBtn">
          <i class="ph ph-x-logo"></i> Publicar no X
        </button>
        <div id="shareCardHint" style="font-size:11px;color:var(--text-3);margin-top:6px;display:none">
          Imagem baixada — anexa ela no post que vai abrir!
        </div>
        <button class="btn-ghost" style="margin-top:8px;width:100%;justify-content:center"
          onclick="document.getElementById('shareCardModal').classList.remove('show')">
          Fechar
        </button>
      </div>`;
    document.body.appendChild(modal);
  }

  document.getElementById('shareCardImg').src = dataUrl;
  document.getElementById('shareCardHint').style.display = 'none';
  modal.classList.add('show');

  document.getElementById('shareCardDownloadBtn').onclick = () => {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    a.click();
  };

  document.getElementById('shareCardShareBtn').onclick = () => {
    canvas.toBlob(async (blob) => {
      const file = new File([blob], filename, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'Soundtrackr' });
        } catch (e) {}
      } else {
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = filename;
        a.click();
      }
    }, 'image/png');
  };

  document.getElementById('shareCardTwitterBtn').onclick = () => {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    a.click();

    document.getElementById('shareCardHint').style.display = 'block';

    const text = trackName
      ? `Ouvindo "${trackName}" — ${artistName || ''} ${rating ? '★'.repeat(rating) : ''} via Soundtrackr`
      : 'Confere meu Soundtrackr!';

    const tweetUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;

    setTimeout(() => {
      window.open(tweetUrl, '_blank');
    }, 600);
  };
}

  await fetch('/logout', { method: 'POST' });
