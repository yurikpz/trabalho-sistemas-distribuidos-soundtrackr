<header class="topbar">
  <div class="topbar-left">
    <a href="/landing" class="brand brand-link">
      <div class="brand-icon">
        <img src="/static/img/logo.png" alt="Soundtrackr Logo" class="brand-logo">
      </div>
      <div class="brand-text">
        <div class="brand-name">Soundtrackr</div>
        <div class="brand-sub">Início</div>
      </div>
    </a>
  </div>

  <div class="topbar-right">
    <a href="/landing" class="nav-link">
      <i class="ph ph-house" style="font-size:15px"></i>
      <span>Início</span>
    </a>
    <a href="/diary" class="nav-link">
      <i class="ph ph-book-open" style="font-size:15px"></i>
      <span>Diário</span>
    </a>
    <a href="/colecao" class="nav-link">
      <i class="ph ph-vinyl-record" style="font-size:15px"></i>
      <span>Coleção</span>
    </a>
    <a href="/perfil" class="nav-link">
      <i class="ph ph-user" style="font-size:15px"></i>
      <span>Perfil</span>
    </a>

    <!-- Busca de usuários -->
    <div class="user-search-wrap">
      <i class="ph ph-magnifying-glass user-search-icon"></i>
      <input
        id="userSearchInput"
        class="user-search-input"
        type="text"
        placeholder="Buscar usuário..."
        autocomplete="off"
      >
      <div id="userSearchResults" class="user-search-results"></div>
    </div>

    <!-- Notificações -->
    <div class="notif-wrap">
      <button class="theme-toggle" onclick="toggleNotifications()" title="Notificações" id="notifBellBtn">
        <i class="ph ph-bell" style="font-size:16px"></i>
        <span id="notifBadge" class="notif-badge" style="display:none">0</span>
      </button>
      <div id="notifDropdown" class="notif-dropdown">
        <div class="notif-dropdown-head">
          <span>Notificações</span>
        </div>
        <div id="notifList" class="notif-list">
          <div class="notif-empty">Carregando...</div>
        </div>
      </div>
    </div>

    <!-- Toggle de tema -->
    <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">
      <i class="ph ph-moon" id="theme-icon" style="font-size:16px"></i>
    </button>

    <button class="logout-btn" onclick="logout()">Sair</button>
  </div>
</header>
<!-- Mini player global de preview -->
<div class="mini-player" id="miniPlayer">
  <img id="miniPlayerCover" class="mini-player-cover" src="" alt="">
  <div class="mini-player-info">
    <div id="miniPlayerTitle" class="mini-player-title">—</div>
    <div id="miniPlayerArtist" class="mini-player-artist">—</div>
  </div>
  <button class="mini-player-btn" onclick="toggleMiniPlayerPlayPause()">
    <i class="ph-fill ph-pause" id="miniPlayerIcon"></i>
  </button>
  <button class="mini-player-btn" onclick="closeMiniPlayer()">
    <i class="ph ph-x"></i>
  </button>
</div>

<style>
  .mini-player {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 900;
    display: none;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border-mid);
  }
  .mini-player.open { display: flex; }

  .mini-player-cover {
    width: 40px; height: 40px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--surface);
    flex-shrink: 0;
  }

  .mini-player-info { flex: 1; min-width: 0; }
  .mini-player-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mini-player-artist {
    font-size: 11px;
    color: var(--text-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mini-player-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border-mid);
    background: transparent;
    color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .mini-player-btn:hover { background: var(--border); color: var(--text-1); }

  /* Botão de play nos cards */
  .preview-play-btn {
    position: absolute;
    bottom: 6px; right: 6px;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border-mid);
    background: rgba(10,12,18,0.85);
    backdrop-filter: blur(4px);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 12px;
    z-index: 3;
    transition: background .15s, transform .1s;
  }
  .preview-play-btn:hover { background: var(--chrome); transform: scale(1.08); }
  .preview-play-btn.loading i { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</parameter>
<style>
  .notif-wrap { position: relative; }

  .theme-toggle { position: relative; }

  .notif-badge {
    position: absolute;
    top: -4px; right: -4px;
    background: #e0546e;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 3px;
    line-height: 1;
  }

  .notif-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 320px;
    max-height: 420px;
    background: var(--card-solid);
    border: 1px solid var(--border-mid);
    border-radius: var(--radius-md);
    box-shadow: 0 16px 48px rgba(0,0,0,0.4);
    z-index: 1000;
    overflow: hidden;
    display: none;
    flex-direction: column;
  }

  .notif-dropdown.open { display: flex; }

  .notif-dropdown-head {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-1);
  }

  .notif-list {
    overflow-y: auto;
    max-height: 360px;
  }

  .notif-empty {
    padding: 24px 14px;
    text-align: center;
    color: var(--text-3);
    font-size: 13px;
  }

  .notif-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    text-decoration: none;
    color: var(--text-1);
    transition: background .12s;
    border-bottom: 1px solid var(--border);
  }
  .notif-item:last-child { border-bottom: none; }
  .notif-item:hover { background: var(--border); }
  .notif-item.unread { background: rgba(140,170,200,0.06); }

  .notif-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--surface);
    flex-shrink: 0;
    border: 1px solid var(--border-mid);
  }

  .notif-icon-badge {
    position: absolute;
    bottom: -2px; right: -2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    border: 2px solid var(--card-solid);
  }
  .notif-icon-badge.follow { background: var(--chrome); color: #fff; }
  .notif-icon-badge.review_like { background: #e0546e; color: #fff; }
  .notif-icon-badge.list_like { background: #e0546e; color: #fff; }

  .notif-avatar-wrap { position: relative; flex-shrink: 0; }

  .notif-text { flex: 1; font-size: 13px; line-height: 1.4; }
  .notif-text strong { font-weight: 600; }
  .notif-time { font-size: 11px; color: var(--text-3); margin-top: 2px; }
</style>

<script>
// ── Tema ──────────────────────────────────────────────────────────────────────
function toggleTheme() {
  const html  = document.documentElement;
  const isDark = html.getAttribute('data-theme') !== 'light';
  const next  = isDark ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  const icon = document.getElementById('theme-icon');
  if (icon) icon.className = next === 'light' ? 'ph ph-sun' : 'ph ph-moon';
  localStorage.setItem('theme', next);
}

(function () {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  const icon = document.getElementById('theme-icon');
  if (icon) icon.className = saved === 'light' ? 'ph ph-sun' : 'ph ph-moon';
})();


// ── Busca de usuários ─────────────────────────────────────────────────────────
(function () {
  let _timer = null;
  const inp = document.getElementById('userSearchInput');
  const res = document.getElementById('userSearchResults');
  if (!inp) return;

  inp.addEventListener('input', () => {
    clearTimeout(_timer);
    const q = inp.value.trim();
    if (q.length < 2) { res.classList.remove('open'); return; }
    _timer = setTimeout(() => _fetchUsers(q), 300);
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.user-search-wrap')) res.classList.remove('open');
  });

  async function _fetchUsers(q) {
    try {
      const data = await fetch(`/users/search?q=${encodeURIComponent(q)}`).then(r => r.json());
      if (!data.length) {
        res.innerHTML = '<div class="user-search-empty">Nenhum usuário encontrado</div>';
      } else {
        res.innerHTML = data.map(u => `
          <a class="user-result-item" href="/u/${u.id}">
            <img
              class="user-result-avatar"
              src="/static/${u.avatar}"
              onerror="this.src='/static/img/default.png'"
            >
            <div>
              <div class="user-result-name">${u.username}</div>
              ${u.fandom ? `<div class="user-result-fandom">${u.fandom}</div>` : ''}
            </div>
          </a>
        `).join('');
      }
      res.classList.add('open');
    } catch (e) {
      console.error(e);
    }
  }
})();


// ── Notificações ──────────────────────────────────────────────────────────────
const notifDropdown = document.getElementById('notifDropdown');
const notifList     = document.getElementById('notifList');
const notifBadge    = document.getElementById('notifBadge');

async function refreshNotifBadge() {
  try {
    const data = await fetch('/notifications/unread_count').then(r => r.json());
    if (data.count > 0) {
      notifBadge.textContent = data.count > 9 ? '9+' : data.count;
      notifBadge.style.display = 'flex';
    } else {
      notifBadge.style.display = 'none';
    }
  } catch (e) { console.error(e); }
}

function notifText(n) {
  const name = `<strong>${n.actor_username}</strong>`;
  switch (n.type) {
    case 'follow':      return `${name} começou a seguir você`;
    case 'review_like': return `${name} curtiu sua review`;
    case 'list_like':   return `${name} curtiu sua lista`;
    default:             return `${name} interagiu com você`;
  }
}

function notifIcon(type) {
  switch (type) {
    case 'follow':      return { cls: 'follow',      icon: 'ph-user-plus' };
    case 'review_like': return { cls: 'review_like', icon: 'ph-heart' };
    case 'list_like':   return { cls: 'list_like',   icon: 'ph-heart' };
    default:             return { cls: 'follow',      icon: 'ph-bell' };
  }
}

function timeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
  if (diff < 60) return 'agora';
  if (diff < 3600) return `${Math.floor(diff/60)}min`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h`;
  return `${Math.floor(diff/86400)}d`;
}

async function loadNotifications() {
  try {
    const data = await fetch('/notifications').then(r => r.json());
    if (!data.length) {
      notifList.innerHTML = '<div class="notif-empty">Nenhuma notificação ainda</div>';
      return;
    }

    notifList.innerHTML = data.map(n => {
      const { cls, icon } = notifIcon(n.type);
      const href = n.type === 'follow' ? `/u/${n.actor_id}` : '#';
      return `
        <a class="notif-item ${n.is_read ? '' : 'unread'}" href="${href}">
          <div class="notif-avatar-wrap">
            <img class="notif-avatar" src="/static/${n.actor_avatar}" onerror="this.src='/static/img/default.png'">
            <div class="notif-icon-badge ${cls}"><i class="ph-bold ${icon}"></i></div>
          </div>
          <div>
            <div class="notif-text">${notifText(n)}</div>
            <div class="notif-time">${timeAgo(n.createdAt)}</div>
          </div>
        </a>`;
    }).join('');
  } catch (e) {
    console.error(e);
    notifList.innerHTML = '<div class="notif-empty">Erro ao carregar</div>';
  }
}

async function toggleNotifications() {
  const isOpen = notifDropdown.classList.contains('open');
  notifDropdown.classList.toggle('open', !isOpen);

  if (!isOpen) {
    loadNotifications();
    await fetch('/notifications/mark_read', { method: 'POST' });
    notifBadge.style.display = 'none';
  }
}

document.addEventListener('click', e => {
  if (!e.target.closest('.notif-wrap')) notifDropdown.classList.remove('open');
});

refreshNotifBadge();
setInterval(refreshNotifBadge, 30000); // atualiza a cada 30s

//preview
// ── Mini player de preview ──────────────────────────────────────────────────
let currentPreviewTrackId = null;
const previewAudio = new Audio();

previewAudio.addEventListener('ended', () => {
  updatePlayButtons(currentPreviewTrackId, false);
});

async function playPreview(trackId, title, artist, cover, btnEl) {
  // Mesma faixa já carregada — só alterna play/pause
  if (currentPreviewTrackId === trackId && previewAudio.src) {
    if (previewAudio.paused) {
      previewAudio.play();
      updatePlayButtons(trackId, true);
    } else {
      previewAudio.pause();
      updatePlayButtons(trackId, false);
    }
    return;
  }

  showMiniPlayer(title, artist, cover);
  if (btnEl) btnEl.classList.add('loading');

  try {
    const res  = await fetch(`/preview/${trackId}`);
    const data = await res.json();

    if (!data.previewUrl) {
      showToast('Prévia não disponível para essa faixa.');
      closeMiniPlayer();
      return;
    }

    previewAudio.src = data.previewUrl;
    currentPreviewTrackId = trackId;
    previewAudio.play();
    updatePlayButtons(trackId, true);
  } catch (e) {
    console.error(e);
  } finally {
    if (btnEl) btnEl.classList.remove('loading');
  }
}

function updatePlayButtons(trackId, isPlaying) {
  document.querySelectorAll('.preview-play-btn').forEach(btn => {
    const match = btn.dataset.trackid === String(trackId);
    const icon  = btn.querySelector('i');
    if (icon) icon.className = (match && isPlaying) ? 'ph-fill ph-pause' : 'ph-fill ph-play';
  });
  const miniIcon = document.getElementById('miniPlayerIcon');
  if (miniIcon) miniIcon.className = isPlaying ? 'ph-fill ph-pause' : 'ph-fill ph-play';
}

function showMiniPlayer(title, artist, cover) {
  document.getElementById('miniPlayerTitle').textContent  = title || '—';
  document.getElementById('miniPlayerArtist').textContent = artist || '—';
  document.getElementById('miniPlayerCover').src = cover || '/static/img/default.png';
  document.getElementById('miniPlayer').classList.add('open');
}

function toggleMiniPlayerPlayPause() {
  if (previewAudio.paused) {
    previewAudio.play();
    updatePlayButtons(currentPreviewTrackId, true);
  } else {
    previewAudio.pause();
    updatePlayButtons(currentPreviewTrackId, false);
  }
}

function closeMiniPlayer() {
  previewAudio.pause();
  previewAudio.removeAttribute('src');
  updatePlayButtons(currentPreviewTrackId, false);
  currentPreviewTrackId = null;
  document.getElementById('miniPlayer').classList.remove('open');
}
// ── Logout ────────────────────────────────────────────────────────────────────
async function logout() {
  await fetch('/logout', { method: 'POST' });
  window.location = '/login';
}
</script>
