<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Coleção — Soundtrackr</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/perfil.css">
  <link rel="icon" type="image/png" href="/static/img/logo.png">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js"></script>

  <style>
    .col-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 4px;
    }

    .col-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      transition: transform .15s, border-color .15s;
    }
    .col-card:hover { transform: translateY(-2px); border-color: var(--border-mid); }
    .col-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line-top), transparent);
      z-index: 2;
    }

    /* ── Mockups 3D ── */
    .col-mockup {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: var(--surface);
      overflow: hidden;
    }
    .col-mockup .col-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .col-cover-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-3);
    }

    /* CD — jewel case */
    .col-mockup-cd { box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
    .col-mockup-cd .cd-shine {
      position: absolute; inset: 0;
      background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.28) 48%, transparent 60%);
      pointer-events: none;
    }
    .col-mockup-cd .cd-spine {
      position: absolute; left: 0; top: 0; bottom: 0; width: 7%;
      background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(0,0,0,.35));
      box-shadow: 2px 0 4px rgba(0,0,0,.3);
    }

    /* Vinil — capa quadrada com disco espiando */
    .col-mockup-vinil .col-cover {
      position: relative;
      z-index: 2;
      width: 86%;
      box-shadow: 3px 0 10px rgba(0,0,0,.45);
    }
    .col-mockup-vinil .vinyl-disc {
      position: absolute;
      right: -32%;
      top: 6%;
      bottom: 6%;
      aspect-ratio: 1;
      border-radius: 50%;
      z-index: 1;
      background: repeating-radial-gradient(circle at 50% 50%, #161616 0 3px, #050505 3px 5px);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.05), 0 4px 10px rgba(0,0,0,.5);
    }
    .col-mockup-vinil .vinyl-disc::after {
      content: '';
      position: absolute; inset: 34%;
      border-radius: 50%;
      background: var(--chrome-mid);
      opacity: .55;
    }
    .col-mockup-vinil .vinyl-disc::before {
      content: '';
      position: absolute; inset: 46%;
      border-radius: 50%;
      background: #000;
    }

    /* Cassete / K7 */
    .col-mockup-cassete {
      background: linear-gradient(160deg, #1c1c1c, #0e0e0e);
      padding: 9%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 6%;
    }
    .col-mockup-cassete .cassette-label {
      flex: 1;
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
    }
    .col-mockup-cassete .cassette-label .col-cover { width: 100%; height: 100%; }
    .col-mockup-cassete .cassette-reels {
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 30%;
    }
    .col-mockup-cassete .reel {
      width: 24%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, #3a3a3a 0 22%, #111 22% 46%, #3a3a3a 46% 52%, transparent 52%);
      position: relative;
    }
    .col-mockup-cassete .reel::after {
      content: '';
      position: absolute; inset: 40%;
      border-radius: 50%;
      background: #000;
    }

    .col-info { padding: 10px; }
    .col-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .col-artist { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .col-meta { font-size: 10px; color: var(--text-3); margin-top: 2px; }

    .col-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 600;
      background: rgba(140,170,200,0.1);
      border: 1px solid var(--border-mid);
      color: var(--chrome-lt);
    }

    .col-actions {
      position: absolute;
      top: 8px; right: 8px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity .15s;
      z-index: 3;
    }
    .col-card:hover .col-actions { opacity: 1; }

    .col-action-btn {
      width: 28px; height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border-mid);
      background: rgba(10,12,18,0.85);
      backdrop-filter: blur(4px);
      color: var(--text-2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s, color .15s;
      font-size: 13px;
    }
    .col-action-btn:hover { background: var(--border); color: var(--text-1); }
    .col-action-btn.danger:hover { background: rgba(220,80,80,.2); color: #e07070; }

    .private-badge {
      position: absolute;
      top: 8px; left: 8px;
      background: rgba(10,12,18,0.85);
      border: 1px solid var(--border-mid);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 10px;
      color: var(--text-3);
      display: flex; align-items: center; gap: 3px;
      backdrop-filter: blur(4px);
      z-index: 3;
    }

    /* Modal de adicionar */
    .add-modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      z-index: 500;
      place-items: center;
    }
    .add-modal-overlay.open { display: grid; }

    .add-modal {
      background: var(--card-solid);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 92%;
      max-width: 460px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .add-modal::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      background: linear-gradient(90deg, transparent, var(--line-top), transparent);
    }

    .add-modal h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-1);
    }

    .search-results-modal {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scrollbar-width: thin;
    }

    .search-result-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      transition: border-color .12s, background .12s;
    }
    .search-result-row:hover,
    .search-result-row.selected {
      border-color: var(--chrome);
      background: rgba(140,170,200,0.08);
    }

    .search-result-cover {
      width: 40px; height: 40px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--surface);
      flex-shrink: 0;
    }

    .search-result-title { font-weight: 600; font-size: 13px; color: var(--text-1); }
    .search-result-artist { font-size: 11px; color: var(--text-3); margin-top: 1px; }
    .search-result-meta { font-size: 10px; color: var(--text-3); margin-top: 1px; }

    .media-type-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .media-type-btn {
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-mid);
      background: transparent;
      color: var(--text-2);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all .15s;
      display: flex; align-items: center; gap: 5px;
    }
    .media-type-btn:hover { border-color: var(--chrome); color: var(--text-1); }
    .media-type-btn.selected {
      background: var(--chrome);
      border-color: var(--chrome);
      color: #fff;
      font-weight: 600;
    }

    .visibility-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-2);
    }

    .toggle-switch {
      width: 36px; height: 20px;
      border-radius: 10px;
      background: var(--border-mid);
      position: relative;
      cursor: pointer;
      transition: background .2s;
      flex-shrink: 0;
      border: none;
    }
    .toggle-switch.on { background: var(--accent); }
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: left .2s;
    }
    .toggle-switch.on::after { left: 19px; }

    .photo-upload-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      border: 1px dashed var(--border-mid);
      color: var(--text-3);
      font-size: 13px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .photo-upload-label:hover { border-color: var(--chrome); color: var(--text-2); }

    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .filter-btn {
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-3);
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all .15s;
    }
    .filter-btn:hover { border-color: var(--border-mid); color: var(--text-2); }
    .filter-btn.active { background: var(--card-solid); border-color: var(--border-mid); color: var(--chrome-lt); font-weight: 600; }

    .col-empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-3);
      font-size: 14px;
      line-height: 1.8;
    }
  </style>
</head>

<body>

{% include '_header.html' %}

<main class="container">

  <section class="panel glass">
    <div class="panel-head" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">
      <div>
        <div class="panel-title">
          <i class="ph ph-vinyl-record" style="font-size:17px;color:var(--chrome-mid)"></i>
          Minha Coleção
        </div>
        <div class="panel-sub">Mídias físicas — Vinil, CD, Cassete e mais</div>
      </div>
      <button class="btn-primary" onclick="openAddModal()">
        <i class="ph ph-plus" style="font-size:14px"></i>
        Adicionar
      </button>
    </div>

    <!-- Filtros -->
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">Todos</button>
      <button class="filter-btn" data-filter="Vinil" onclick="setFilter('Vinil', this)">
        <i class="ph ph-vinyl-record" style="font-size:12px"></i> Vinil
      </button>
      <button class="filter-btn" data-filter="CD" onclick="setFilter('CD', this)">
        <i class="ph ph-disc" style="font-size:12px"></i> CD
      </button>
      <button class="filter-btn" data-filter="Cassete" onclick="setFilter('Cassete', this)">
        <i class="ph ph-cassette-tape" style="font-size:12px"></i> Cassete
      </button>
      <button class="filter-btn" data-filter="Outro" onclick="setFilter('Outro', this)">Outro</button>
    </div>

    <div class="col-grid" id="col-grid">
      <div class="col-empty">
        <i class="ph ph-vinyl-record" style="font-size:40px;margin-bottom:12px;display:block;color:var(--border-mid)"></i>
        Sua coleção está vazia.<br>
        Clique em <strong style="color:var(--chrome-lt)">Adicionar</strong> para começar.
      </div>
    </div>
  </section>

</main>

<!-- Modal de adicionar -->
<div class="add-modal-overlay" id="addModalOverlay" onclick="handleOverlayClick(event)">
  <div class="add-modal">
    <h3><i class="ph ph-plus-circle" style="font-size:17px;color:var(--chrome-mid)"></i> Adicionar à coleção</h3>

    <!-- Busca -->
    <div style="position:relative">
      <i class="ph ph-magnifying-glass" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:15px;pointer-events:none"></i>
      <input
        id="colSearchInput"
        class="input"
        type="text"
        placeholder="Buscar release no Discogs..."
        style="padding-left:32px;width:100%"
        oninput="handleColSearch(this.value)"
        autocomplete="off"
      >
    </div>

    <div class="search-results-modal" id="colSearchResults"></div>

    <!-- Item selecionado -->
    <div id="selectedItem" style="display:none">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-3);margin-bottom:8px">Item selecionado</div>
      <div style="display:flex;align-items:center;gap:10px;padding:10px;background:var(--card);border:1px solid var(--border-mid);border-radius:var(--radius-sm)">
        <img id="selCover" src="" style="width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--surface)">
        <div>
          <div id="selTitle" style="font-weight:600;font-size:13px;color:var(--text-1)"></div>
          <div id="selArtist" style="font-size:11px;color:var(--text-3);margin-top:1px"></div>
          <div id="selMeta" style="font-size:10px;color:var(--text-3);margin-top:1px"></div>
        </div>
      </div>
    </div>

    <!-- Tipo de mídia -->
    <div>
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-3);margin-bottom:8px">Tipo de mídia</div>
      <div class="media-type-row">
        <button class="media-type-btn" data-type="Vinil" onclick="selectMediaType('Vinil', this)">
          <i class="ph ph-vinyl-record" style="font-size:14px"></i> Vinil
        </button>
        <button class="media-type-btn" data-type="CD" onclick="selectMediaType('CD', this)">
          <i class="ph ph-disc" style="font-size:14px"></i> CD
        </button>
        <button class="media-type-btn" data-type="Cassete" onclick="selectMediaType('Cassete', this)">
          <i class="ph ph-cassette-tape" style="font-size:14px"></i> Cassete
        </button>
        <button class="media-type-btn" data-type="Outro" onclick="selectMediaType('Outro', this)">Outro</button>
      </div>
    </div>

    <!-- Foto -->
    <div>
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-3);margin-bottom:8px">Foto da sua cópia (opcional)</div>
      <label class="photo-upload-label" for="colPhotoInput">
        <i class="ph ph-camera" style="font-size:16px"></i>
        <span id="photoLabel">Clique para adicionar uma foto</span>
      </label>
      <input type="file" id="colPhotoInput" accept="image/*" style="display:none" onchange="handlePhotoSelect(this)">
    </div>

    <!-- Visibilidade -->
    <div class="visibility-row">
      <button class="toggle-switch on" id="visibilityToggle" onclick="toggleVisibility()"></button>
      <span id="visibilityLabel">
        <i class="ph ph-globe" style="font-size:13px"></i> Público
      </span>
    </div>

    <!-- Botões -->
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn-primary" style="flex:1;justify-content:center" onclick="submitAdd()">
        <i class="ph ph-check" style="font-size:14px"></i> Adicionar
      </button>
      <button class="btn-ghost" onclick="closeAddModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
// ── Estado ────────────────────────────────────────────────────────────────────
let selectedTrack  = null;
let selectedMedia  = null;
let isPublic       = true;
let allItems       = [];
let activeFilter   = 'all';
let searchTimer    = null;

const mediaIcons = { Vinil: 'ph-vinyl-record', CD: 'ph-disc', Cassete: 'ph-cassette-tape', K7: 'ph-cassette-tape', Outro: 'ph-package' };

// ── Carregar coleção ──────────────────────────────────────────────────────────
async function loadCollection() {
  const res  = await fetch('/collection/{{ user_id }}');
  const data = await res.json();
  allItems = data;
  renderGrid(data);
}

function buildCoverMockup(item, coverSrc) {
  const iconFallback = mediaIcons[item.media_type] || 'ph-music-note';
  const onerr = `onerror="this.src='/static/img/default.png'"`;

  if (!coverSrc) {
    return `<div class="col-mockup col-mockup-${(item.media_type || '').toLowerCase()}">
      <div class="col-cover-placeholder"><i class="ph ${iconFallback}" style="font-size:36px"></i></div>
    </div>`;
  }

  if (item.media_type === 'Vinil') {
    return `
      <div class="col-mockup col-mockup-vinil">
        <div class="vinyl-disc"></div>
        <img class="col-cover" src="${coverSrc}" ${onerr}>
      </div>`;
  }

  if (item.media_type === 'Cassete' || item.media_type === 'K7') {
    return `
      <div class="col-mockup col-mockup-cassete">
        <div class="cassette-label"><img class="col-cover" src="${coverSrc}" ${onerr}></div>
        <div class="cassette-reels"><div class="reel"></div><div class="reel"></div></div>
      </div>`;
  }

  if (item.media_type === 'CD') {
    return `
      <div class="col-mockup col-mockup-cd">
        <img class="col-cover" src="${coverSrc}" ${onerr}>
        <div class="cd-shine"></div>
        <div class="cd-spine"></div>
      </div>`;
  }

  return `
    <div class="col-mockup col-mockup-outro">
      <img class="col-cover" src="${coverSrc}" ${onerr}>
    </div>`;
}

function renderGrid(items) {
  const grid = document.getElementById('col-grid');
  const filtered = activeFilter === 'all' ? items : items.filter(i => i.media_type === activeFilter);

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="col-empty" style="grid-column:1/-1">
        <i class="ph ph-vinyl-record" style="font-size:40px;margin-bottom:12px;display:block;color:var(--border-mid)"></i>
        Nenhum item aqui ainda.
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(item => {
    const coverSrc = item.photo ? `/static/${item.photo}` : (item.artworkUrl100 || '');
    const mockup   = buildCoverMockup(item, coverSrc);

    const privateBadge = !item.is_public
      ? `<div class="private-badge"><i class="ph ph-lock" style="font-size:10px"></i> Privado</div>`
      : '';

    const actions = `
      <div class="col-actions">
        <button class="col-action-btn" onclick="toggleVis(${item.id}, event)" title="${item.is_public ? 'Tornar privado' : 'Tornar público'}">
          <i class="ph ${item.is_public ? 'ph-eye' : 'ph-eye-slash'}" style="font-size:13px"></i>
        </button>
        <button class="col-action-btn danger" onclick="deleteItem(${item.id}, event)" title="Remover">
          <i class="ph ph-trash" style="font-size:13px"></i>
        </button>
      </div>`;

    const metaLine = (item.year || item.label)
      ? `<div class="col-meta">${[item.year, item.label].filter(Boolean).join(' · ')}</div>`
      : '';

    return `
      <div class="col-card" id="col-${item.id}">
        ${mockup}
        ${privateBadge}
        ${actions}
        <div class="col-info">
          <div class="col-title">${item.trackName || '—'}</div>
          <div class="col-artist">${item.artistName || ''}</div>
          ${metaLine}
          <span class="col-badge">
            <i class="ph ${mediaIcons[item.media_type] || 'ph-music-note'}" style="font-size:11px"></i>
            ${item.media_type}
          </span>
        </div>
      </div>`;
  }).join('');
}

// ── Filtros ───────────────────────────────────────────────────────────────────
function setFilter(type, btn) {
  activeFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid(allItems);
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openAddModal() {
  selectedTrack = null;
  selectedMedia = null;
  isPublic      = true;
  document.getElementById('colSearchInput').value = '';
  document.getElementById('colSearchResults').innerHTML = '';
  document.getElementById('selectedItem').style.display = 'none';
  document.getElementById('colPhotoInput').value = '';
  document.getElementById('photoLabel').textContent = 'Clique para adicionar uma foto';
  document.querySelectorAll('.media-type-btn').forEach(b => b.classList.remove('selected'));
  const tog = document.getElementById('visibilityToggle');
  tog.classList.add('on');
  document.getElementById('visibilityLabel').innerHTML = '<i class="ph ph-globe" style="font-size:13px"></i> Público';
  document.getElementById('addModalOverlay').classList.add('open');
}

function closeAddModal() {
  document.getElementById('addModalOverlay').classList.remove('open');
}

function handleOverlayClick(e) {
  if (e.target === e.currentTarget) closeAddModal();
}

// ── Busca via Discogs (proxy do backend) ──────────────────────────────────────
function handleColSearch(val) {
  clearTimeout(searchTimer);
  const q = val.trim();
  if (q.length < 2) {
    document.getElementById('colSearchResults').innerHTML = '';
    return;
  }
  searchTimer = setTimeout(() => fetchColSearch(q), 350);
}

async function fetchColSearch(q) {
  try {
    const res  = await fetch(`/collection/discogs_search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    renderColResults(data || []);
  } catch(e) { console.error(e); }
}

function renderColResults(results) {
  const box = document.getElementById('colSearchResults');
  if (!results.length) {
    box.innerHTML = '<div style="color:var(--text-3);font-size:13px;padding:8px">Nenhum resultado</div>';
    return;
  }
  box.innerHTML = results.map(r => `
    <div class="search-result-row" onclick="selectTrack(${JSON.stringify(r).replace(/"/g, '&quot;')})">
      <img class="search-result-cover" src="${r.artworkUrl100}" onerror="this.src='/static/img/default.png'">
      <div>
        <div class="search-result-title">${r.trackName || '—'}</div>
        <div class="search-result-artist">${r.artistName || ''}</div>
        <div class="search-result-meta">${[r.year, r.format].filter(Boolean).join(' · ')}</div>
      </div>
    </div>
  `).join('');
}

function selectTrack(track) {
  selectedTrack = track;
  document.getElementById('colSearchResults').innerHTML = '';
  document.getElementById('colSearchInput').value = '';

  document.getElementById('selCover').src   = track.artworkUrl100 || '/static/img/default.png';
  document.getElementById('selTitle').textContent  = track.trackName || '—';
  document.getElementById('selArtist').textContent = track.artistName || '';
  document.getElementById('selMeta').textContent   = [track.year, track.label].filter(Boolean).join(' · ');
  document.getElementById('selectedItem').style.display = 'block';

  // Auto-seleciona tipo de mídia com base no formato do Discogs
  const fmt = (track.format || '').toLowerCase();
  let autoType = null;
  if (fmt.includes('vinyl') || fmt.includes('lp'))   autoType = 'Vinil';
  else if (fmt.includes('cassette'))                 autoType = 'Cassete';
  else if (fmt.includes('cd'))                       autoType = 'CD';

  if (autoType) {
    selectedMedia = autoType;
    document.querySelectorAll('.media-type-btn').forEach(b => {
      b.classList.toggle('selected', b.dataset.type === autoType);
    });
  }
}

// ── Tipo de mídia ─────────────────────────────────────────────────────────────
function selectMediaType(type, btn) {
  selectedMedia = type;
  document.querySelectorAll('.media-type-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

// ── Foto ──────────────────────────────────────────────────────────────────────
function handlePhotoSelect(input) {
  const label = document.getElementById('photoLabel');
  label.textContent = input.files[0]?.name || 'Clique para adicionar uma foto';
}

// ── Visibilidade ──────────────────────────────────────────────────────────────
function toggleVisibility() {
  isPublic = !isPublic;
  const tog = document.getElementById('visibilityToggle');
  tog.classList.toggle('on', isPublic);
  document.getElementById('visibilityLabel').innerHTML = isPublic
    ? '<i class="ph ph-globe" style="font-size:13px"></i> Público'
    : '<i class="ph ph-lock" style="font-size:13px"></i> Privado';
}

// ── Enviar ────────────────────────────────────────────────────────────────────
async function submitAdd() {
  if (!selectedTrack) return alert('Selecione um item primeiro.');
  if (!selectedMedia) return alert('Selecione o tipo de mídia.');

  const photoInput = document.getElementById('colPhotoInput');
  const hasPhoto   = photoInput.files && photoInput.files[0];

  const form = new FormData();
  form.append('trackId',       selectedTrack.discogs_id || '');
  form.append('trackName',     selectedTrack.trackName || '');
  form.append('artistName',    selectedTrack.artistName || '');
  form.append('artworkUrl100', selectedTrack.artworkUrl100 || '');
  form.append('media_type',    selectedMedia);
  form.append('is_public',     isPublic ? '1' : '0');
  form.append('discogs_id',    selectedTrack.discogs_id || '');
  form.append('year',          selectedTrack.year || '');
  form.append('label',         selectedTrack.label || '');
  form.append('catno',         selectedTrack.catno || '');
  form.append('country',       selectedTrack.country || '');
  if (hasPhoto) form.append('photo', photoInput.files[0]);

  try {
    const res  = await fetch('/collection/add', { method: 'POST', body: form });
    const data = await res.json();
    if (data.success) {
      closeAddModal();
      showToast('Adicionado à coleção!');
      loadCollection();
    }
  } catch(e) { console.error(e); }
}

// ── Deletar ───────────────────────────────────────────────────────────────────
async function deleteItem(id, e) {
  e.stopPropagation();
  if (!confirm('Remover da coleção?')) return;
  await fetch('/collection/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  allItems = allItems.filter(i => i.id !== id);
  renderGrid(allItems);
  showToast('Removido da coleção.');
}

// ── Toggle visibilidade ───────────────────────────────────────────────────────
async function toggleVis(id, e) {
  e.stopPropagation();
  const res  = await fetch('/collection/toggle_visibility', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  const data = await res.json();
  if (data.success) {
    const item = allItems.find(i => i.id === id);
    if (item) item.is_public = data.is_public;
    renderGrid(allItems);
  }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<i class="ph ph-check-circle" style="font-size:15px;color:var(--accent-lt)"></i> ${msg}`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

loadCollection();
</script>

</body>
